<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="w-full  h-full flex flex-col items-center justify-center gap-10">
  <div class="flex item-center justify-between w-1/3" id="scorecard">
    <div>Time:<span id="Time">0</span></div>
    <div>Score:<span id="score">0</span></div>
  </div>
  <div class="w-1/3 h-[70vh] relative border border-black   " id="main">
    <div class="size-20 absolute bg-cover" id="box"></div>
  </div>  
  <button id="start" class="bg-blue-500 text-white px-4 py-2 rounded">Start</button>

  <script>
      let time = document.getElementById("Time")
      let score= document.getElementById("score")
      let startButton = document.getElementById("start")
      let main = document.getElementById("main")
      let box = document.getElementById("box")

      let arr = [
          "https://images.unsplash.com/photo-1790847329682-f22dceb2ee71?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw1fHx8ZW58MHx8fHx8",
          "https://images.unsplash.com/photo-1789758612601-6203670d039a?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw4fHx8ZW58MHx8fHx8",
          "https://images.unsplash.com/photo-1790254128674-74eac7e39300?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxMHx8fGVufDB8fHx8fA%3D%3D",
          "https://images.unsplash.com/photo-1790278844149-6ea4675066fa?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxNHx8fGVufDB8fHx8fA%3D%3D",
          "https://plus.unsplash.com/premium_photo-1736609966528-c0cacdb8a8c6?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyMHx8fGVufDB8fHx8fA%3D%3D",
          "https://images.unsplash.com/photo-1789758385633-f95b3ad7a41d?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyMnx8fGVufDB8fHx8fA%3D%3D"

        ]
      
      let clicked = Array(arr.length).fill(false);

      let timeValue = 0;
      let scoreValue = 0;
      let go = false;

      startButton.addEventListener("click", function() {
        go = true;
        let interval = setInterval(function() {
          clicked = Array(arr.length).fill(false);  
          timeValue++;
          time.textContent = timeValue;
          let rt = Math.floor(Math.random() *80);
          let rl = Math.floor(Math.random() *80);
          
          let idx = Math.floor(Math.random() * arr.length);
          clicked[idx] = true;
          console.log(arr[idx])
          box.style.top = `${rt}%`;
          box.style.left = `${rl}%`;  
          box.style.backgroundImage = `url(${arr[idx]})`;

        }, 1000);



        setTimeout(function() {
          go = false;
          clearInterval(interval);  
          clicked = Array(arr.length).fill(false);
        }, 10000);
      });

      box.addEventListener("click",()=>{
        if(!go || !clicked) return;
        scoreValue++;
        score.textContent = scoreValue;
      })



  </script>
</body>
</html>
